name: Fork CI

# NOTE: This CI runs on CPU-only runners (ubuntu-latest, -ngl 0).
# GPU verification (CUDA + Vulkan) is NOT automated  -  it must be done
# manually on the respective machines after merging:
#
#   CUDA (A's machine, RTX 3090):
#     cmake -B build-cuda -DGGML_CUDA=ON -DGGML_NATIVE=ON ...
#     cmake --build build-cuda --target llama-hs-extract-batch test-hidden-states
#     LD_LIBRARY_PATH=build-cuda/bin build-cuda/bin/llama-hs-extract-batch --self-test
#     LD_LIBRARY_PATH=build-cuda/bin build-cuda/bin/test-hidden-states <model.gguf>
#     LD_LIBRARY_PATH=build-cuda/bin build-cuda/bin/llama-hs-extract-batch <model> <prompts> all <out> --batch --assignments <file> -ngl 99
#
#   Vulkan (D's machine):
#     cmake -B build-vulkan -DGGML_VULKAN=ON -DGGML_NATIVE=ON ...
#     cmake --build build-vulkan --target llama-hs-extract-batch test-hidden-states
#     (same self-test + extraction commands with build-vulkan/bin/)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ccache curl

      - name: Record runner CPU model (ccache key isolation)
        run: |
          set -euo pipefail
          CPU_MODEL=$(lscpu 2>/dev/null | grep -m1 'Model name' | sed 's/Model name:[[:space:]]*//' | tr -c '[:alnum:]' '-' | cut -c1-40)
          echo "CPU_MODEL=${CPU_MODEL:-unknown}" >> "$GITHUB_ENV"
          echo "Runner CPU: ${CPU_MODEL:-unknown}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fork-ci-${{ runner.os }}-${{ env.CPU_MODEL }}
          max-size: 512M

      - name: Configure compiler to use ccache
        run: |
          set -euo pipefail
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Set build parallelism
        run: |
          set -euo pipefail
          echo "BUILD_PARALLEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Print environment info
        run: |
          set -euo pipefail
          echo "=== Build Environment ==="
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | awk '/^Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"
          cmake --version | head -1
          g++ --version | head -1

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build core (llama lib + server + cli)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "::group::Building llama library"
          cmake --build build --target llama llama-common -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building llama-server"
          cmake --build build --target llama-server -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building llama-cli"
          cmake --build build --target llama-cli -j"${BUILD_PARALLEL}"
          echo "::endgroup::"

      - name: Verify core binaries
        run: |
          set -euo pipefail
          for b in llama-server llama-cli; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      - name: Build hidden states tools
        run: |
          set -euo pipefail
          echo "::group::Building hs-extract"
          cmake --build build --target llama-hs-extract -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building hs-extract-batch"
          cmake --build build --target llama-hs-extract-batch -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building hidden-states example"
          cmake --build build --target llama-hidden-states -j"${BUILD_PARALLEL}"
          echo "::endgroup::"

      - name: Verify hidden states binaries
        run: |
          set -euo pipefail
          for b in llama-hs-extract llama-hs-extract-batch llama-hidden-states; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      - name: Build test binaries
        run: |
          set -euo pipefail
          echo "::group::Building test-hidden-states (C++)"
          cmake --build build --target test-hidden-states -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building test-hidden-states-c (C)"
          cmake --build build --target test-hidden-states-c -j"${BUILD_PARALLEL}"
          echo "::endgroup::"

      - name: Verify test binaries
        run: |
          set -euo pipefail
          for b in test-hidden-states test-hidden-states-c; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      - name: Report ccache stats
        run: ccache -s

      - name: Set library path
        run: |
          set -euo pipefail
          echo "LD_LIBRARY_PATH=build/bin" >> "$GITHUB_ENV"

      - name: Run compute_masked_mean self-tests
        run: |
          set -euo pipefail
          echo "::group::Self-test output"
          build/bin/llama-hs-extract-batch --self-test
          echo "::endgroup::"

      - name: Verify hs-extract --help
        run: |
          set -euo pipefail
          build/bin/llama-hs-extract --help

      - name: Verify hs-extract-batch --help
        run: |
          set -euo pipefail
          build/bin/llama-hs-extract-batch --help

      - name: Cache test model
        id: cache
        uses: actions/cache@v4
        with:
          path: models/test-model.gguf
          key: test-model-gemma4-e2b-q4km-v1

      - name: Download test model
        timeout-minutes: 5
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p models
          wget --continue --timeout=120 -O models/test-model.gguf \
            "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf"
          ls -lh models/test-model.gguf

      - name: Run hidden-states test binaries with model
        run: |
          set -euo pipefail
          echo "::group::test-hidden-states (C++)"
          LD_LIBRARY_PATH=build/bin build/bin/test-hidden-states models/test-model.gguf
          echo "::endgroup::"
          echo "::group::test-hidden-states-c (C)"
          LD_LIBRARY_PATH=build/bin build/bin/test-hidden-states-c models/test-model.gguf
          echo "::endgroup::"

      - name: Run logits probe + hs-extract-batch-test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "::group::Building llama-hs-probe"
          cmake --build build --target llama-hs-probe -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::Building llama-hs-extract-batch-test"
          cmake --build build --target llama-hs-extract-batch-test -j"${BUILD_PARALLEL}"
          echo "::endgroup::"
          echo "::group::llama-hs-probe (logits identical with/without extraction)"
          LD_LIBRARY_PATH=build/bin build/bin/llama-hs-probe models/test-model.gguf "The quick brown fox"
          echo "::endgroup::"
          echo "::group::llama-hs-extract-batch-test (warmup/toggle equivalence)"
          LD_LIBRARY_PATH=build/bin build/bin/llama-hs-extract-batch-test models/test-model.gguf "The quick brown fox" 0
          LD_LIBRARY_PATH=build/bin build/bin/llama-hs-extract-batch-test models/test-model.gguf "The quick brown fox" 1
          echo "::endgroup::"

      - name: Smoke test /hidden-states server endpoint
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "::group::Starting llama-server for endpoint test"
          LD_LIBRARY_PATH=build/bin build/bin/llama-server \
            -m models/test-model.gguf \
            --host 127.0.0.1 --port 8097 \
            -ngl 0 -c 512 -np 1 \
            --cache-ram 0 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null; wait $SERVER_PID 2>/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8097/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          echo "--- Test: last_token pool ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hello world","layers":[0,5,10],"normalize":false,"pool":"last"}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert len(d) == 1, 'expected 1 result'
          assert d[0]['tokens_evaluated'] >= 2, 'expected >= 2 tokens'
          layers = sorted(int(k) for k in d[0]['hidden_states'])
          assert layers == [0,5,10], f'unexpected layers: {layers}'
          print(f'PASS: last_token pool, tokens={d[0][\"tokens_evaluated\"]}, layers={layers}')
          "
          echo "--- Test: skip_mean pool ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"I am feeling very happy and excited today","layers":[0,5],"normalize":false,"pool":"skip_mean","skip_offset":3}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert len(d[0]['hidden_states']) == 2, 'expected 2 layers'
          print(f'PASS: skip_mean pool, tokens={d[0][\"tokens_evaluated\"]}')
          "
          echo "--- Test: normalize=true ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hello","layers":[0],"normalize":true,"pool":"last"}')
          echo "$RESP" | python3 -c "
          import sys, json, math
          d = json.load(sys.stdin)
          v = d[0]['hidden_states']['0']
          norm = math.sqrt(sum(x*x for x in v))
          assert abs(norm - 1.0) < 0.01, f'expected unit norm, got {norm}'
          print(f'PASS: normalize=true, norm={norm:.4f}')
          "
          echo "--- Test: normalize=false inverse ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"test","layers":[0],"normalize":false,"pool":"last"}')
          echo "$RESP" | python3 -c "
          import sys, json, math
          d = json.load(sys.stdin)
          v = d[0]['hidden_states']['0']
          norm = math.sqrt(sum(x*x for x in v))
          assert abs(norm - 1.0) > 0.01, f'unnormalized vector should not have unit norm, got {norm}'
          print(f'PASS: normalize=false, norm={norm:.4f}')
          "
          echo "--- Test: missing input field (400) ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"layers":[0],"normalize":false,"pool":"last"}')
          if [ "$HTTP_CODE" != "400" ]; then
            echo "FAIL: expected 400 for missing input field, got $HTTP_CODE"
            exit 1
          fi
          echo "PASS: missing input field returns 400"
          echo "--- Test: out-of-range layer (400) ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"test","layers":[999999],"normalize":false,"pool":"last"}')
          if [ "$HTTP_CODE" != "400" ]; then
            echo "FAIL: expected 400 for out-of-range layer, got $HTTP_CODE"
            exit 1
          fi
          echo "PASS: out-of-range layer returns 400"
          echo "--- Test: negative skip_offset (400) ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"test","layers":[0],"normalize":false,"pool":"skip_mean","skip_offset":-5}')
          if [ "$HTTP_CODE" != "400" ]; then
            echo "FAIL: expected 400 for negative skip_offset, got $HTTP_CODE"
            exit 1
          fi
          echo "PASS: negative skip_offset returns 400"
          echo "--- Test: short text skip_mean (400) ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hi","layers":[0],"normalize":false,"pool":"skip_mean","skip_offset":50}')
          if [ "$HTTP_CODE" != "400" ]; then
            echo "FAIL: expected 400 for short text, got $HTTP_CODE"
            exit 1
          fi
          echo "PASS: short text skip_mean returns 400"
          echo "--- All endpoint tests passed ---"
          echo "::endgroup::"

      - name: Test multi-ubatch extraction (>512 tokens)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "Starting server with small ubatch for multi-ubatch pool=none test..."
          LD_LIBRARY_PATH=build/bin build/bin/llama-server \
            -m models/test-model.gguf \
            -ngl 0 -c 2048 -b 2048 -ub 512 -np 1 --port 8098 \
            --cache-ram 0 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null; wait $SERVER_PID 2>/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8098/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          LONG_TEXT=$(python3 -c "print('The quick brown fox jumps over the lazy dog. ' * 60)")
          RESP=$(curl -sf -X POST http://127.0.0.1:8098/hidden-states \
            -H "Content-Type: application/json" \
            -d "{\"input\":\"$LONG_TEXT\",\"layers\":[0],\"normalize\":false,\"pool\":\"none\"}")
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          tokens = d[0]['tokens_evaluated']
          assert tokens > 512, f'expected >512 tokens, got {tokens}'
          states = d[0]['hidden_states']
          vec = states['0']
          assert len(vec) % tokens == 0, f'flat vector length {len(vec)} not divisible by tokens {tokens}'
          hidden_size = len(vec) // tokens
          assert hidden_size > 0, 'hidden size must be positive'
          assert len(vec) == tokens * hidden_size, 'flat pool=none array size mismatch'
          assert any(v != 0.0 for v in vec), 'pool=none hidden states are all zero'
          print(f'PASS: multi-ubatch pool=none extraction, {tokens} tokens, hidden_size={hidden_size}')
          "

      - name: Quick audit fix integrity check
        run: |
          set -euo pipefail
          echo "=== Check 1: uint64_t key (flat accumulator) ==="
          grep -q "uint64_t key\|uint64_t make_accum_key\|uint64_t flat_key" tools/hs-extract-batch/hs-extract-batch.cpp && echo "PASS" || { echo "FAIL: uint64_t key missing"; exit 1; }
          echo "=== Check 2: output_all defined ==="
          grep -q "const bool output_all" src/llama-context.cpp && echo "PASS" || { echo "FAIL: output_all missing"; exit 1; }
          echo "=== Check 3: RAII LlamaBackend ==="
          for f in examples/hidden-states/hidden-states.cpp tools/hs-extract/hs-extract.cpp; do
            grep -q "LlamaBackend" "$f" && echo "PASS: $f" || { echo "FAIL: missing RAII LlamaBackend in $f"; exit 1; }
          done
          echo "=== Check 4: hidden-state getters synchronize (upstream getter idiom) ==="
          for f in src/llama-context.cpp; do
            grep -q "llama_context::get_hidden_state\b" "$f" || { echo "FAIL: get_hidden_state impl missing"; exit 1; }
            grep -A2 "^float \* llama_get_hidden_state(" "$f" | grep -q "ctx->synchronize()" && echo "PASS: getters sync" || { echo "FAIL: llama_get_hidden_state does not synchronize"; exit 1; }
          done
          echo "=== Check 5: All fclose calls are inside FilePtr RAII wrapper ==="
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('tools/hs-extract-batch/hs-extract-batch.cpp').read_text().splitlines()
          in_fileptr = False
          brace_depth = 0
          outside = []
          for lineno, line in enumerate(lines, 1):
              stripped = line.strip()
              if stripped.startswith('struct FilePtr'):
                  in_fileptr = True
                  brace_depth = 0
              if in_fileptr:
                  brace_depth += line.count('{') - line.count('}')
                  if brace_depth <= 0:
                      in_fileptr = False
              elif 'fclose(' in line.split('//')[0] and not stripped.startswith(('//', '*', '/*')):
                  outside.append(f'{lineno}: {line.strip()}')
          if outside:
              print(f'FAIL: {len(outside)} fclose calls outside FilePtr:')
              for o in outside: print(f'  {o}')
              raise SystemExit(1)
          print('PASS: all fclose calls inside FilePtr RAII wrapper')
          PY
          echo "=== Check 6: No CHECKED_WRITE in int-returning run functions ==="
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('tools/hs-extract-batch/hs-extract-batch.cpp').read_text().splitlines()
          active = None
          bad = []
          for lineno, line in enumerate(lines, 1):
              if line.startswith(('static int run_raw', 'static int run_batch', 'static int run_self_test')):
                  active = line.strip()
              elif line.startswith(('static bool ', 'int main')):
                  active = None
              if active and 'CHECKED_WRITE' in line:
                  bad.append(f'{lineno}: {active}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('PASS')
          PY
          echo "=== Check 7: assignment reader uses explicit status ==="
          grep -q "enum class AssignmentReadStatus" tools/hs-extract-batch/hs-extract-batch.cpp && echo "PASS" || { echo "FAIL: explicit assignment read status missing"; exit 1; }
          echo "=== Check 8: prompt pre-scan is pure and does not call exit ==="
          # auto_size_ctx was removed by cb140146b (single-pass pre-scan
          # refactor); its successor must uphold the same contract: pure
          # stream walk, returns bool, never exits.
          if sed -n '/static bool scan_prompts_file/,/^}/p' tools/hs-extract-batch/hs-extract-batch.cpp | grep -q "exit("; then
          echo "FAIL: scan_prompts_file calls exit()"; exit 1
          fi
          if ! grep -q "struct PromptsScan" tools/hs-extract-batch/hs-extract-batch.cpp; then
          echo "FAIL: PromptsScan struct missing (pre-scan contract changed; update this check)"; exit 1
          fi
          echo "PASS"
          echo "=== Check 9: No off-by-one ==="
          if grep -q "i <= n_layer" tools/hs-extract/hs-extract.cpp tools/hs-extract-batch/hs-extract-batch.cpp 2>/dev/null; then
            echo "FAIL: found incorrect i <= n_layer (should be < n_layer)"; exit 1
          fi
          echo "PASS"
          echo "=== Check 10: checkpoint n_masks/n_layers_data bounds validation ==="
          if ! grep -q "n_masks.*out of range" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: checkpoint n_masks bounds check missing"; exit 1
          fi
          if ! grep -q "n_layers_data.*out of range" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: checkpoint n_layers_data bounds check missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 11: output writer uses pre-built index (not O(K^2) rescan) ==="
          if ! { grep -q "group_index\|gm_pairs" tools/hs-extract-batch/hs-extract-batch.cpp; }; then
            echo "FAIL: output writer pre-built index missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 12: checkpoint count/layer_idx validation ==="
          if ! grep -q "count.*negative.*corrupt checkpoint" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: checkpoint count validation missing"; exit 1
          fi
          if ! grep -q "layer_idx.*out of range.*corrupt checkpoint" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: checkpoint layer_idx validation missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 13: producer-consumer pipeline error notification ==="
          # The batch tool uses a producer-consumer pipeline where a prefetch
          # thread (producer) reads prompts + assignments while the main thread
          # (consumer) does GPU decode. Error paths must notify the consumer via
          # the condition variable to avoid deadlock.
          if ! grep -q "pfq.cv.notify" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: producer-consumer cv notification missing"; exit 1
          fi
          if ! grep -q "pfq.producer_done" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: producer_done flag missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 14: shared RAII header used by all fork tools ==="
          # RAII wrappers (LlamaBackend, LlamaModel, LlamaContext, LlamaBatch)
          # are extracted to common/llama-raii.h. All fork tools must include it
          # instead of defining their own copies.
          if [ ! -f common/llama-raii.h ]; then
            echo "FAIL: common/llama-raii.h missing"; exit 1
          fi
          for f in tools/hs-extract/hs-extract.cpp tools/hs-extract-batch/hs-extract-batch.cpp tests/test-hidden-states.cpp; do
            if ! grep -q 'llama-raii.h' "$f"; then
              echo "FAIL: $f does not include llama-raii.h"; exit 1
            fi
          done
          echo "PASS"
          echo "=== Check 15: async pipeline backpressure (bounded queue) ==="
          # The producer-consumer queue must have backpressure to prevent
          # unbounded memory growth on 200K-prompt runs.
          if ! grep -q "cv_space" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: backpressure cv_space missing"; exit 1
          fi
          if ! grep -q "MAX_PREFETCH" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: MAX_PREFETCH bound missing"; exit 1
          fi
          if ! grep -q "STOP_PRODUCER_AND_JOIN" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: STOP_PRODUCER_AND_JOIN macro missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 16: server pool=none response size limit ==="
          # The /hidden-states endpoint must cap pool=none response size to
          # prevent DoS via enormous JSON responses.
          if ! grep -q "MAX_POOL_NONE_FLOATS" tools/server/server-context.cpp; then
            echo "FAIL: pool=none response size limit missing"; exit 1
          fi
          echo "PASS"
          echo "=== Check 17: checkpoint version 2 (sum-based, no precision loss) ==="
          if ! grep -q "CHECKPOINT_VERSION = 2" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: checkpoint version not bumped to 2"; exit 1
          fi
          if ! grep -q "write_sum" tools/hs-extract-batch/hs-extract-batch.cpp; then
            echo "FAIL: write_sum parameter missing from _write_accumulator_to_file"; exit 1
          fi
          echo "PASS"
          echo "OK: All audit fix patterns verified"
