name: Fork CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BUILD_PARALLEL: 4

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fork-ci-${{ runner.os }}
          max-size: 512M

      - name: Configure compiler to use ccache
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Print environment info
        run: |
          echo "=== Build Environment ==="
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | awk '/^Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"
          cmake --version | head -1
          g++ --version | head -1

      # ---------------------------------------------------------------- #
      # Configure                                                        #
      # ---------------------------------------------------------------- #
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ---------------------------------------------------------------- #
      # Build - core library + server                                    #
      # ---------------------------------------------------------------- #
      - name: Build core (llama lib + server + cli)
        run: |
          echo "::group::Building llama library"
          cmake --build build --target llama llama-common -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"
          echo "::group::Building llama-server"
          cmake --build build --target llama-server -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"
          echo "::group::Building llama-cli"
          cmake --build build --target llama-cli -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"

      - name: Verify core binaries
        run: |
          for b in llama-server llama-cli; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      # ---------------------------------------------------------------- #
      # Build - custom hidden states tools                               #
      # ---------------------------------------------------------------- #
      - name: Build hidden states tools
        run: |
          echo "::group::Building hs-extract"
          cmake --build build --target llama-hs-extract -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"
          echo "::group::Building hs-extract-batch"
          cmake --build build --target llama-hs-extract-batch -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"
          echo "::group::Building hidden-states example"
          cmake --build build --target llama-hidden-states -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"

      - name: Verify hidden states binaries
        run: |
          for b in llama-hs-extract llama-hs-extract-batch llama-hidden-states; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      # ---------------------------------------------------------------- #
      # Build - tests                                                    #
      # ---------------------------------------------------------------- #
      - name: Build test binaries
        run: |
          echo "::group::Building test-hidden-states (C++)"
          cmake --build build --target test-hidden-states -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"
          echo "::group::Building test-hidden-states-c (C)"
          cmake --build build --target test-hidden-states-c -j${{ env.BUILD_PARALLEL }}
          echo "::endgroup::"

      - name: Verify test binaries
        run: |
          for b in test-hidden-states test-hidden-states-c; do
            test -f "build/bin/$b" || { echo "Missing: $b"; exit 1; }
            echo "  OK: $b ($(du -h build/bin/$b | cut -f1))"
          done

      # ---------------------------------------------------------------- #
      # Run tests                                                        #
      # ---------------------------------------------------------------- #
      - name: Set library path
        run: echo "LD_LIBRARY_PATH=build/bin" >> $GITHUB_ENV

      - name: Run compute_masked_mean self-tests
        run: |
          echo "::group::Self-test output"
          build/bin/llama-hs-extract-batch --self-test
          echo "::endgroup::"

      - name: Verify hs-extract --help
        run: |
          echo "::group::hs-extract --help"
          build/bin/llama-hs-extract --help
          echo "::endgroup::"

      - name: Verify hs-extract-batch --help
        run: |
          echo "::group::hs-extract-batch --help"
          build/bin/llama-hs-extract-batch --help
          echo "::endgroup::"

      # ---------------------------------------------------------------- #
      # Download a small model and run the hidden-states API tests       #
      # ---------------------------------------------------------------- #
      - name: Download test model
        run: |
          echo "::group::Downloading test model for API tests"
          mkdir -p models
          # The test model MUST have a patched architecture (gemma, gemma4, llama, qwen35).
          # Primary: Gemma 4 E2B (gemma4 architecture, patched, small ~1.5GB).
          # Fallback: Qwen3.5-2B (qwen35 architecture, also patched).
          wget -q -O models/test-model.gguf \
            "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf" \
            || wget -q -O models/test-model.gguf \
              "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf" \
            || { echo "Failed to download test model"; exit 1; }
          ls -lh models/test-model.gguf
          echo "::endgroup::"

      - name: Run hidden-states test binaries with model
        run: |
          echo "::group::test-hidden-states (C++)"
          LD_LIBRARY_PATH=build/bin build/bin/test-hidden-states models/test-model.gguf
          echo "::endgroup::"
          echo "::group::test-hidden-states-c (C)"
          LD_LIBRARY_PATH=build/bin build/bin/test-hidden-states-c models/test-model.gguf
          echo "::endgroup::"

      - name: Smoke test /hidden-states server endpoint
        run: |
          echo "::group::Starting llama-server for endpoint test"
          LD_LIBRARY_PATH=build/bin build/bin/llama-server \
            -m models/test-model.gguf \
            --host 127.0.0.1 --port 8097 \
            -ngl 0 -c 512 -np 1 \
            --cache-ram 0 --no-jinja --chat-template chatml &
          SERVER_PID=$!
          # Wait for server to be ready (max 30 seconds)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8097/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          # Run endpoint tests
          echo "--- Test: last_token pool ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hello world","layers":[0,5,10],"normalize":false,"pool":"last"}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert len(d) == 1, 'expected 1 result'
          assert d[0]['tokens_evaluated'] >= 2, 'expected >= 2 tokens'
          layers = sorted(int(k) for k in d[0]['hidden_states'])
          assert layers == [0,5,10], f'unexpected layers: {layers}'
          print(f'PASS: last_token pool, tokens={d[0][\"tokens_evaluated\"]}, layers={layers}')
          "
          echo "--- Test: skip_mean pool ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"I am feeling very happy and excited today","layers":[0,5],"normalize":false,"pool":"skip_mean","skip_offset":3}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert len(d[0]['hidden_states']) == 2, 'expected 2 layers'
          print(f'PASS: skip_mean pool, tokens={d[0][\"tokens_evaluated\"]}')
          "
          echo "--- Test: normalize=true ---"
          RESP=$(curl -sf -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hello","layers":[0],"normalize":true,"pool":"last"}')
          echo "$RESP" | python3 -c "
          import sys, json, math
          d = json.load(sys.stdin)
          v = d[0]['hidden_states']['0']
          norm = math.sqrt(sum(x*x for x in v))
          assert abs(norm - 1.0) < 0.01, f'expected unit norm, got {norm}'
          print(f'PASS: normalize=true, norm={norm:.4f}')
          "
          echo "--- Test: short text error (skip_mean) ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8097/hidden-states \
            -H "Content-Type: application/json" \
            -d '{"input":"Hi","layers":[0],"normalize":false,"pool":"skip_mean","skip_offset":50}')
          if [ "$HTTP_CODE" != "400" ]; then
            echo "FAIL: expected 400 for short text, got $HTTP_CODE"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "PASS: short text skip_mean returns 400"
          echo "--- All endpoint tests passed ---"
          kill $SERVER_PID 2>/dev/null || true
          echo "::endgroup::"

      # ---------------------------------------------------------------- #
      # Verify audit fixes are intact                                    #
      # ---------------------------------------------------------------- #
      - name: Verify resource leak fixes
        run: |
          # examples/hidden-states.cpp uses RAII wrappers (LlamaBackend destructor)
          # instead of raw llama_backend_free calls.
          if grep -q "llama_backend_init()" examples/hidden-states/hidden-states.cpp && \
             ! grep -q "LlamaBackend" examples/hidden-states/hidden-states.cpp; then
            echo "Expected RAII LlamaBackend in examples/hidden-states.cpp"
            exit 1
          fi
          echo "  OK: examples/hidden-states.cpp uses RAII wrappers"
          # hs-extract.cpp also uses RAII wrappers
          if ! grep -q "LlamaBackend" tools/hs-extract/hs-extract.cpp; then
            echo "Expected RAII LlamaBackend in tools/hs-extract/hs-extract.cpp"
            exit 1
          fi
          echo "  OK: tools/hs-extract/hs-extract.cpp uses RAII wrappers"
          # hs-extract-batch.cpp uses FilePtr for checkpoint I/O.
          # The only fclose allowed is inside the FilePtr destructor.
          raw_fcloses=$(grep -n "fclose" tools/hs-extract-batch/hs-extract-batch.cpp | grep -v "~FilePtr" | wc -l)
          if [ "$raw_fcloses" -gt 0 ]; then
            echo "Found $raw_fcloses raw fclose() calls in hs-extract-batch.cpp - should use FilePtr"
            grep -n "fclose" tools/hs-extract-batch/hs-extract-batch.cpp | grep -v "~FilePtr"
            exit 1
          fi
          echo "  OK: hs-extract-batch.cpp uses FilePtr (no raw fclose outside destructor)"

      - name: Verify CUDA sync fixes
        run: |
          for f in tools/hs-extract/hs-extract.cpp \
                   tools/hs-extract-batch/hs-extract-batch.cpp \
                   examples/hidden-states/hidden-states.cpp; do
            grep -q "llama_synchronize" "$f" || {
              echo "Missing llama_synchronize in $f"
              exit 1
            }
            echo "  OK: llama_synchronize in $f"
          done

      - name: Verify off-by-one fixes
        run: |
          if grep -q "i <= n_layer" tools/hs-extract/hs-extract.cpp \
                          tools/hs-extract-batch/hs-extract-batch.cpp 2>/dev/null; then
            echo "Found incorrect i <= n_layer (should be < n_layer)"
            exit 1
          fi
          echo "  OK: layer boundaries use < not <="

      # ---------------------------------------------------------------- #
      # Summary                                                          #
      # ---------------------------------------------------------------- #
      - name: CI Summary
        if: always()
        run: |
          echo "## Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core (server + cli) | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hidden States Tools | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Binaries (executed with model) | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Server Endpoint (/hidden-states) | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Self-Tests | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit Fix Verification | ${{ job.status == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
