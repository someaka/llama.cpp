name: Fork CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile-check:
    runs-on: ubuntu-latest
    name: Compile Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure build
        run: |
          cmake -B build -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON

      - name: Compile all targets
        run: |
          cmake --build build -j$(nproc)

      - name: Verify binaries
        run: |
          test -f build/bin/llama-server
          test -f build/bin/llama-hs-extract
          test -f build/bin/llama-hs-extract-batch
          test -f build/bin/test-hidden-states
          test -f build/bin/test-hidden-states-c
          echo "✓ All binaries compiled successfully"

      - name: Run hidden states self-test
        run: |
          build/bin/llama-hs-extract-batch --self-test
